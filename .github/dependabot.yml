version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    # The Solana SDK is pinned (=2.2.1) on purpose; upgrade it as a deliberate migration.
    ignore:
      - dependency-name: "solana-*"
      - dependency-name: "spl-*"
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
