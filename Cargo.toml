[package]
name = "shred_pool_cache"
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
# thin has minimal overhead vs none (default): https://blog.llvm.org/2016/06/thinlto-scalable-and-incremental-lto.html
lto = "thin"

[features]
default = ["tui"]
# Terminal dashboard (`--tui`).
tui = ["dep:ratatui"]

[dependencies]
axum = { version = "0.8.1", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
ratatui = { version = "0.29", optional = true }

tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"

thiserror = "1.0.38"

# Solana ecosystem
solana-sdk = "3"
solana-client = "3"
spl-associated-token-account = "8"
solana-entry = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-compute-budget-interface = "3"
solana-commitment-config = "3"
spl-token = "9"

# TLS
rustls = { version = "0.23.23", features = ["ring"] }

# Other dependencies
log = "0.4"
env_logger = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bs58 = "0.5.1"
dotenvy = "0.15"

lazy_static = "1.4"

jito-protos = { path = "./jito_protos" }
tonic = { version = "0.12.3", features = ["tls", "tls-roots", "tls-webpki-roots"] }

bincode = "1.3.3"
rand = "0.9.1"


[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
sha2 = "0.10"
